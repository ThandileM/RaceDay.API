
name: RaceDay API CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show project files
        run: find . -name "*.csproj"

      - name: Restore dependencies
        run: dotnet restore ./RaceDay.API/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build and run tests
        run: dotnet test ./RaceDay.API/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release
